<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model_실습5.html</title>
    <style>
        /* 웹페이지 초기화*/
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            margin: 0px;
            padding: 30px;

        }

        /* div 공통파일 */
        /* class 명은 두개 이상 줄수 있다 class="별칭1 별칭2..." */



        div.box {
            width: 375px;
            height: 100px;
            color: black;
            font-size: 16px;
            text-align: center;
            line-height: 60px;
            margin: 20px auto;

            border: 1px solid black
        }

        div.box1 {

            padding: 10px;
            border: 2px solid #1a5276;
            background-color: #3498db;

        }




        div.box2 {
            padding: 20px;
            border: 4px solid #761a6d;
            background-color: #7adb34;

        }

        div.box3 {
            padding: 30px;
            border: 6px solid #cad223;
            background-color: #db3466;

        }
    </style>
</head>

<body>
    <h2 style="text-align: center;">📦Box Model 종합 실습</h2>

    <div class="box box1">padding:10px / border:2px solid</div>
    <div class="box box2">padding:20px / border:4px solid</div>
    <div class="box box3">padding:30px / border:6px solid</div>
</body>

</html>
