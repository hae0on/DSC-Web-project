<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display 실습2 Inline</title>
<style>
    /* 웹페이지 초기화*/
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    span.inline-box{
background-color: #e743ce;
color: white;
padding: 10px;
width: 200px;
height: 50px; /*인라인태그는 높이 적용X*/


    }






</style>
</head>

<body>
    <h2>Inline</h2>
    <span class="inline-box">span 태그란? 블록요소의 또 다른 요소를 추가 할 시 활용한다.</span>
<span class="inline-box">span 태그</span>
<span class="inline-box">span 태그</span>

<!-- 결과: 나란히 배치, winth / hegiht 무시됨! -->

</body>

</html>
