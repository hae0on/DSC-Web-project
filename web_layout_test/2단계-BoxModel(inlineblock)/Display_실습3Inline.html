<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display 실습3 Inline-block</title>
<style>
    /* 웹페이지 초기화*/
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    div.Inline-block-box {
        background-color: #2ecc71;
        color: white;
        padding: 10px;
        margin: 5px;
        width: 300px;
        height: 80px;
        text-align: center;
        line-height: 80px;
        /* 1. display "inline-block" */
        display: inline-block;

        /* 2. display "block" 반복해서 적용연습 */
        /* display: block; */



    }
</style>
</head>

<body>
    <h2>Inline block 태그확인</h2>
    <div class="Inline-block-box">box1</div>
    <div class="Inline-block-box">box2</div>
    <div class="Inline-block-box">box3</div>


</body>

</html>
