<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루비 문자 학습</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    rt {
        color: blue;
        font-weight: bold;
        background-color: yellow;
    }
</style>

<body>
    <h1>루비 문자(Ruby Text)</h1>
    <p>
        한자 예시:
        <ruby>韓<rt>한</rt> 子<rt>자</rt></ruby>
    </p>
    <p>
        한글 예시:
        <ruby> 청출어람 <rt>靑出於藍</rt></ruby>(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        <ruby> 學生 <rt>がくせいです</rt></ruby>
    </p>

    <hr />



</body>

</html>
